# .github/workflows/ruby-lint.yml

name: Ruby Lint

# Runs RuboCop across the supported Ruby versions and fails the job on any
# offense that .rubocop_todo.yml does not baseline (see the header of
# .rubocop.yml). It uses RuboCop's default fail level, so convention and
# refactor offenses fail the job as well as warnings. Offenses are also
# emitted as GitHub annotations. The bundle is installed frozen from
# Gemfile.lock, so the job runs the RuboCop and plugin versions the baseline
# was generated with.
#
# Reek is not run here. It runs in code-smells.yml, where it is advisory:
# its exit code is ignored and the step is continue-on-error.

on:
  push:
    branches:
      - fix/*
      - rel/*
  pull_request:
    branches:
      - main
      - develop
      - feature/*
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10 # prevent hung jobs

    runs-on: ubuntu-24.04

    env:
      # Never re-resolve the bundle: RuboCop must be the version locked in
      # Gemfile.lock. setup-ruby's bundler-cache already installs in
      # deployment mode when the lockfile exists; this keeps the guarantee
      # explicit for every bundle command in the job.
      BUNDLE_FROZEN: 'true'

    strategy:
      fail-fast: true
      matrix:
        ruby: ['3.2', '3.3', '3.4', '3.5', '4.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Installs the bundle from Gemfile.lock into vendor/bundle and caches it.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true

      - name: Run RuboCop
        run: |
          bundle exec rubocop --verbose-version
          bundle exec rubocop --config .rubocop.yml --format progress --format github
