name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model for this run (overrides the CLAUDE_MODEL repo variable)"
        type: choice
        required: false
        default: claude-opus-4-6
        options:
          - claude-opus-4-6
          - claude-sonnet-4-6
          - claude-haiku-4-5-20251001

jobs:
  claude-review:
    # Run only when ALL of the following hold:
    #   1. Author is not a bot (renovate, dependabot, etc. surface as 'name[bot]').
    #   2. PR head is not from a fork. Fork PRs run without repository secrets, so
    #      CLAUDE_CODE_OAUTH_TOKEN is empty and the action would fail.
    #   3. The event is a freshly opened PR, a 'claude-review' label add, or a push
    #      to a PR that already carries the 'claude-review' label.
    if: ${{
      !endsWith(github.actor, '[bot]') &&
      !github.event.pull_request.head.repo.fork &&
      (
        (github.event.action == 'opened') ||
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'claude-review'))
      )
      }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1.0.190
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Primary model precedence: the workflow_dispatch "model" input (manual
          # runs) -> the CLAUDE_MODEL repo variable -> this built-in default.
          # Pinning a current id avoids the action's frozen default, which 404s
          # ("model: claude-sonnet-4-20250514"). Fall back to Sonnet on overload.
          # v1 of the action dropped the model/fallback_model/allowed_tools
          # inputs; they are CLI flags passed via claude_args now (see
          # docs/migration-guide.md and docs/usage.md in the action repo).
          claude_args: |
            --model ${{ inputs.model || vars.CLAUDE_MODEL || 'claude-opus-4-6' }}
            --fallback-model ${{ vars.CLAUDE_FALLBACK_MODEL || 'claude-sonnet-4-6' }}
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"

          # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          use_sticky_comment: true

          # v1 renamed direct_prompt -> prompt. The REPO/PR NUMBER header is the
          # format the migration guide calls for so Claude reviews the right PR.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's AGENTS.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.
