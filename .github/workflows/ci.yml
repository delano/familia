name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The repo's own bundle includes development and test gems, which can supply
  # a library that familia requires but does not declare (base64 arrived this
  # way, through ruby-prof). This job bundles familia alone, as an application
  # does, and fails if it cannot be required or if Ruby warns that a required
  # library is leaving the default gems.
  consumer-load:
    timeout-minutes: 10

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Require familia from a bundle that contains only familia
        run: |
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          printf "source 'https://rubygems.org'\ngem 'familia', path: '%s'\n" "$GITHUB_WORKSPACE" > Gemfile
          bundle install
          if ! out=$(bundle exec ruby -e 'require "familia"; puts "familia #{Familia::VERSION} loaded"' 2>&1); then
            echo "$out"
            echo "::error::require 'familia' failed in a bundle that contains only familia"
            exit 1
          fi
          echo "$out"
          if grep -q "loaded from the standard library" <<<"$out"; then
            echo "::error::familia requires a library that is leaving Ruby's default gems without declaring it in familia.gemspec"
            exit 1
          fi

  # An application can resolve any release familia.gemspec allows, not only
  # the newest one consumer-load gets. This job pins each runtime dependency
  # to the lowest release the gemspec allows and fails if familia, or
  # json_schemer (which familia requires on first schema validation), cannot
  # be required or if Ruby warns that a library is leaving the default gems.
  # Ruby 3.4 raises LoadError for the libraries that left the default gems in
  # 3.4 and warns for those that leave in 4.0, so one Ruby covers both.
  consumer-load-lowest:
    timeout-minutes: 10

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Require familia with the lowest dependency releases it allows
        run: |
          consumer="$RUNNER_TEMP/consumer-lowest"
          mkdir -p "$consumer"
          cd "$consumer"
          ruby - "$GITHUB_WORKSPACE" > Gemfile <<'RUBY'
            workspace = ARGV.fetch(0)
            spec = Dir.chdir(workspace) { Gem::Specification.load('familia.gemspec') }
            puts "source 'https://rubygems.org'"
            puts "gem 'familia', path: #{workspace.dump}"
            spec.runtime_dependencies.each do |dep|
              found, = Gem::SpecFetcher.fetcher.spec_for_dependency(dep)
              lowest = found.map { |s, _source| s.version }.min or abort "no release satisfies #{dep}"
              puts "gem #{dep.name.dump}, #{lowest.to_s.dump}"
            end
          RUBY
          cat Gemfile
          bundle install
          probe='require "familia"; require "json_schemer"; puts "familia #{Familia::VERSION} and json_schemer #{JSONSchemer::VERSION} loaded"'
          if ! out=$(bundle exec ruby -e "$probe" 2>&1); then
            echo "$out"
            echo "::error::familia or json_schemer failed to load with the lowest dependency releases familia.gemspec allows"
            exit 1
          fi
          echo "$out"
          if grep -q "loaded from the standard library" <<<"$out"; then
            echo "::error::a dependency release familia.gemspec allows requires a library that is leaving Ruby's default gems without declaring it"
            exit 1
          fi

  build:
    timeout-minutes: 10

    runs-on: ubuntu-24.04

    continue-on-error: ${{ matrix.continue-on-error }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "3.5", "4.0"]
        continue-on-error: [false]

    services:
      redis:
        image: valkey/valkey:8.1-bookworm
        # Set health checks to wait until database server has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          # https://docs.github.com/en/actions/using-containerized-services/creating-redis-service-containers#running-jobs-in-containers
          # Maps port 6379 on service container to 2525 on the host
          - 2525:6379

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # When the following is true, also run "bundle install",
          # and cache the result automatically. Ran into an issue
          # with the caching and multiple ruby versions. Needs
          # further investigation.
          bundler-cache: true

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          detached: true

      - name: Configure Bundler for secure gem installation
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle config set --local deployment 'false'

      - name: Re-run bundle install
        run: bundle install

      - name: Run the tryouts
        run: bundle exec try -vf

      - name: Validate examples
        continue-on-error: true
        run: |
          echo "=== Validating example syntax ==="
          find examples/ -name "*.rb" -exec ruby -c {} \;

          echo "=== Running executable examples ==="
          cd examples
          for example in *.rb; do
            echo "Running $example..."
            ruby "$example" || echo "Warning: $example failed to run"
          done
