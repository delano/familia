# .rubocop.yml

##
# This is the RuboCop configuration file.
# It contains the rules and settings for the RuboCop linter.
#
# Enable/disable the cops individually. For more information,
# refer to the RuboCop documentation:
# https://docs.rubocop.org/rubocop/cops.html
#
# Running `rubocop --regenerate-todo` will update the todo file
# with the latest state of the onion (using the same options
# as those documented at the top of the todo file). This is
# useful for a gradual migration of the codebase.
#
# .rubocop_todo.yml is the baseline of offenses that existed when the
# Ruby Lint workflow started failing on offenses. For most cops it
# lists the files that already broke that cop. Any other offense makes
# `bundle exec rubocop` exit non-zero, locally and in CI; a new offense
# in a file the cop already lists is not reported. Regenerate it with
# `bundle exec rubocop --regenerate-todo` after fixing offenses, and
# review the diff: it should only remove entries.
#
# With `NewCops: enable`, a RuboCop upgrade (including Dependabot bumps
# of rubocop or its plugins) can add cops that flag existing code and
# fail the Ruby Lint workflow on that pull request. Fix the new
# offenses, or run `bundle exec rubocop --regenerate-todo` on the
# upgrade branch and commit the new entries with the version bump.
#
# How to resolve "RuboCop version incompatibility found":
#  `rubocop --stop-server`
#

inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-thread_safety

AllCops:
  NewCops: enable
  UseCache: true
  MaxFilesInCache: 100
  TargetRubyVersion: 3.4
  Exclude:
    - "rspec/**/*.rb"
    - "tmp/**/*.rb"
    - "try/**/*.rb"
    # Setting Exclude here replaces RuboCop's default list, which excludes
    # vendor/. CI installs gems into vendor/bundle inside the checkout.
    - "vendor/**/*"

#
# Trailing commas
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
  Enabled: true

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma
  Enabled: true

Style/TrailingCommaInArguments:
  Enabled: true
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInBlockArgs:
  Enabled: true

Lint/TrailingCommaInAttributeDeclaration:
  Enabled: true

Gemspec/DeprecatedAttributeAssignment:
  Enabled: true

Gemspec/DevelopmentDependencies:
  Enabled: true

Layout/HashAlignment:
  Enabled: false

# Format with consistent indentation levels rather than vertical dot alignment.
Layout/MultilineMethodCallIndentation:
  Enabled: false
  EnforcedStyle: indented
  IndentationWidth: 2

Layout/IndentationWidth:
  Width: 2

Layout/ArgumentAlignment:
  Enabled: false

Layout/DotPosition:
  EnforcedStyle: leading # or 'trailing'

Lint/Void:
  Enabled: false

Layout/MultilineAssignmentLayout:
  Enabled: true
  EnforcedStyle: same_line

Layout/EndAlignment:
  EnforcedStyleAlignWith: start_of_line

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

Layout/ExtraSpacing:
  Enabled: true
  AllowBeforeTrailingComments: true

Metrics/AbcSize:
  Enabled: false
  Max: 20

Metrics/ClassLength:
  Enabled: true
  Max: 350

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: true
  Max: 50
  CountAsOne: ["method_call"]

Metrics/ModuleLength:
  Enabled: true
  Max: 350
  CountAsOne: ["method_call"]

Metrics/ParameterLists:
  Enabled: true
  Max: 6

Performance/Size:
  Enabled: true
  Exclude:
  #   - lib/example.rb

Style/NegatedIfElseCondition:
  Enabled: true

Naming/AsciiIdentifiers:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

# Every lib/ file carries `# frozen_string_literal: true`; require it rather
# than flag it (the previous `never` contradicted the entire codebase).
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always_true

Naming/MemoizedInstanceVariableName:
  Enabled: false

ThreadSafety/ClassAndModuleAttributes:
  Enabled: false

ThreadSafety/ClassInstanceVariable:
  Enabled: false

ThreadSafety/MutableClassInstanceVariable:
  Enabled: false
